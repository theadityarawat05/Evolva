name: Build Evolva Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: |
          npm install
          if [ -d "frontend" ]; then cd frontend && npm install; fi

      - name: Build Android Debug APK
        run: |
          if [ -d "frontend/android" ]; then
            cd frontend/android
          elif [ -d "android" ]; then
            cd android
          else
            echo "Searching for gradlew..."
            cd $(dirname $(find . -name "gradlew" -print -quit))
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Evolva-App-Debug
          path: /**/build/outputs/apk/debug/app-debug.apk
