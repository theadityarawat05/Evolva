name: Build Evolva Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Root Dependencies
        run: npm install --legacy-peer-deps || npm install --force

      - name: Install Frontend Dependencies (if present)
        run: |
          if [ -d "frontend" ]; then
            cd frontend && npm install --legacy-peer-deps || npm install --force
          fi

      - name: Make Gradlew Executable & Build APK
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -print -quit)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew file not found anywhere in repo!"
            exit 1
          fi
          BUILD_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found gradlew in $BUILD_DIR"
          cd "$BUILD_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Evolva-App-Debug
          path: '**/app-debug.apk'
