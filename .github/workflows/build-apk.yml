name: Build Evolva Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 9477386
          packages: 'platforms;android-33 build-tools;33.0.0 ndk;25.1.8937393 cmake;3.22.1'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps || npm install --force
          if [ -d "frontend" ]; then
            cd frontend && npm install --legacy-peer-deps || npm install --force
          fi

      - name: Build Android Debug APK
        run: |
          if [ -f "frontend/android/gradlew" ]; then
            cd frontend/android
          elif [ -f "android/gradlew" ]; then
            cd android
          else
            echo "Searching for app gradlew (excluding node_modules)..."
            APP_GRADLE=$(find . -not -path "*/node_modules/*" -name "gradlew" -print -quit)
            cd $(dirname "$APP_GRADLE")
          fi
          echo "Building in directory: $(pwd)"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4096m"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Evolva-App-Debug
          path: '**/app-debug.apk'
