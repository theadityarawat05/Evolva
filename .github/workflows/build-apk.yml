name: Build Evolva Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK & Specific NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 9477386
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;27.1.12297006 cmake;3.22.1'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps || npm install --force

      - name: Configure local.properties & PATH
        run: |
          echo "sdk.dir=$ANDROID_HOME" > frontend/android/local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/27.1.12297006" >> frontend/android/local.properties

      - name: Build Android Debug APK
        working-directory: frontend/android
        env:
          PATH: ${{ env.PATH }}:${{ env.NODEJS_PATH }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
